name: Astroverse Daily Shorts

on:
  workflow_dispatch:   # Manual trigger only

jobs:
  run-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick ffmpeg fonts-noto fonts-noto-cjk
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
            /etc/ImageMagick-6/policy.xml || true

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > credentials/client_secret.json
          echo '${{ secrets.TOKEN_PICKLE_B64 }}' | base64 --decode > credentials/token.pickle

      - name: Run Astroverse automation
        env:
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          SARVAM_API_KEY:       ${{ secrets.SARVAM_API_KEY }}
          # BPHS grounding (Parashara rules DB) — optional, skipped if unset
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Instagram Reels auto-publish — optional, skipped if unset
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
        run: python main.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: logs/run_log.csv
          retention-days: 30

      # Instagram-optimised videos — download this artifact to your phone
      # (GitHub mobile site → this run → Artifacts → instagram-shorts).
      # Uploaded even if some YouTube uploads failed, since videos are built first.
      - name: Upload Instagram shorts (for offline / mobile download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-shorts-${{ github.run_id }}
          path: instagram/*.mp4
          retention-days: 7
          if-no-files-found: warn
