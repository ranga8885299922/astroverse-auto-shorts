name: Astroverse Daily Shorts

on:
  workflow_dispatch:   # Manual trigger only
    inputs:
      youtube_enabled:
        description: "Upload to YouTube (true/false). Set false for an Instagram-only run."
        required: false
        default: "true"
      sync_secrets_only:
        description: "Only sync IG tokens → Supabase app_secrets (fixes replies), then exit. No videos generated/posted."
        required: false
        default: "false"

jobs:
  run-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick ffmpeg fonts-noto fonts-noto-cjk
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' \
            /etc/ImageMagick-6/policy.xml || true

      - name: Install Python packages
        run: pip install -r requirements.txt

      # Chromium for record_scene.py (the deity+emblem scene recorder). --with-deps
      # pulls the system libraries Chromium needs. Skipped-cost is small; if this
      # step or the recorder ever fails, main.py falls back to the MoviePy render.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > credentials/client_secret.json
          echo '${{ secrets.TOKEN_PICKLE_B64 }}' | base64 --decode > credentials/token.pickle

      - name: Run Astroverse automation
        env:
          # Instagram-only manual runs pass youtube_enabled=false. Scheduled/API
          # triggers omit it → defaults to true (YouTube uploads as normal).
          YOUTUBE_PUBLISH_ENABLED: ${{ github.event.inputs.youtube_enabled || 'true' }}
          # Token-sync-only manual run (fixes IG comment replies after a token
          # rotation without generating or re-posting). Scheduled runs omit it.
          SYNC_SECRETS_ONLY: ${{ github.event.inputs.sync_secrets_only || 'false' }}
          # Astroloz transit engine base URL (computed gochara grounding).
          # Override via repo variable if the backend URL changes.
          ASTROLOZ_API_URL:     ${{ vars.ASTROLOZ_API_URL || 'https://api.astroloz.com' }}
          # Groq model. Overridable via repo variable so a Groq deprecation is a
          # one-line change, not a code edit (llama-3.3-70b-versatile was
          # decommissioned 2026-08-16). Default is qwen3.8-27b — natural Telugu,
          # reliable JSON mode; gpt-oss-120b code-switched into English. Set the
          # GROQ_MODEL repo variable to override.
          GROQ_MODEL:           ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          SARVAM_API_KEY:       ${{ secrets.SARVAM_API_KEY }}
          # BPHS grounding (Parashara rules DB) — optional, skipped if unset
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Instagram Reels auto-publish — optional, skipped if unset
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          # Hindi channel (astroloz.hindi) — optional, skipped if unset
          IG_HINDI_USER_ID:      ${{ secrets.IG_HINDI_USER_ID }}
          IG_HINDI_ACCESS_TOKEN: ${{ secrets.IG_HINDI_ACCESS_TOKEN }}
        run: python main.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: logs/run_log.csv
          retention-days: 30

      # Telugu (astroloz_com) Reels land in instagram/. Hindi (astroloz.hindi)
      # is paused via config.json (enable_hindi:false) — flagged for content, so
      # it produces no files. Telugu IG + YouTube are unaffected.
      - name: Upload Instagram shorts (for offline / mobile download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-shorts-${{ github.run_id }}
          path: instagram/*.mp4
          retention-days: 7
          if-no-files-found: warn
