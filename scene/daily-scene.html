<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily scene</title>
<!--
  Self-contained recording scene for the shorts pipeline (record_scene.py drives
  it with Playwright). Mirrors astroloz-pwa/frontend/src/pages/DailyRecord.jsx.
  Driven by query params:  ?sign=aries&day=Thursday
    sign = english zodiac slug (aries..pisces)
    day  = weekday name (Monday..Sunday) — chooses the deity + background theme
  No text, no audio, no controls. Deity (by day) floats top; gold rasi emblem
  (by sign) glows at the bottom. Images are local: deities/ and rasi/.
-->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  .dScene {
    position:fixed; inset:0; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    font-family: system-ui, sans-serif;
  }
  .dStars {
    position:absolute; inset:-10%; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.4px 1.4px at 10% 20%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 25% 65%, #ffe38a, transparent 60%),
      radial-gradient(1.2px 1.2px at 45% 30%, #fff, transparent 60%),
      radial-gradient(1.2px 1.2px at 70% 75%, #b5ccff, transparent 60%),
      radial-gradient(1.6px 1.6px at 82% 22%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 55% 88%, #ffbfe0, transparent 60%),
      radial-gradient(1.2px 1.2px at 90% 55%, #fff, transparent 60%),
      radial-gradient(1.4px 1.4px at 12% 82%, #cceaff, transparent 60%);
    background-size: 700px 500px;
    animation: dDrift 32s linear infinite, dTwinkle 4.5s ease-in-out infinite alternate;
    opacity: 0.85;
  }
  @keyframes dDrift { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-40px,-20px,0); } }
  @keyframes dTwinkle { 0% { opacity: 0.55; } 100% { opacity: 0.95; } }

  .dTitle {
    position:relative; z-index:3;
    flex: 0 0 auto; width:100%;
    padding: 3.6vh 4vw 0.6vh; text-align:center;
    font-family: "Noto Sans Telugu","Noto Sans Devanagari","Nirmala UI",system-ui,sans-serif;
  }
  .dTitleName {
    font-size: clamp(48px, 8.5vw, 88px); font-weight:800; line-height:1.08;
    color:#ffe9a8;
    text-shadow: 0 0 18px rgba(240,194,67,0.55), 0 0 40px rgba(240,194,67,0.30), 0 2px 6px rgba(0,0,0,0.6);
  }
  .dTitleDate {
    margin-top: 0.5vh;
    font-size: clamp(26px, 4.4vw, 44px); font-weight:600;
    color:#ffffff; opacity:0.94;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  }

  .dDeityZone {
    position:relative; z-index:2;
    flex: 1 1 auto; width:100%;
    display:flex; align-items:flex-end; justify-content:center;
    padding-top: 1vh;
  }
  .dDeity {
    max-height: 96%; max-width: 84%; object-fit: contain;
    animation: dFloat 6s ease-in-out infinite, dHalo 3.6s ease-in-out infinite alternate;
    will-change: transform, filter;
  }
  .dSilhouette { height: 92%; }
  @keyframes dFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-14px) scale(1.015); }
  }
  @keyframes dHalo {
    from { filter: drop-shadow(0 0 24px rgba(240,190,90,0.45)) drop-shadow(0 0 52px rgba(240,190,90,0.25)); }
    to   { filter: drop-shadow(0 0 40px rgba(255,240,195,0.72)) drop-shadow(0 0 84px rgba(255,240,195,0.42)); }
  }

  .dGlyphZone {
    position:relative; z-index:2;
    flex: 0 0 30%; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding-bottom: 4vh;
  }
  .dGlyphImg {
    height: clamp(190px, 36vw, 360px);
    max-width: 82%; object-fit: contain;
    animation: dGlyphFloat 6s ease-in-out infinite,
               dGlyphImgGlow 3.5s ease-in-out infinite alternate;
    will-change: transform, filter;
  }
  @keyframes dGlyphImgGlow {
    from { filter: drop-shadow(0 0 16px rgba(240,194,67,0.40)) drop-shadow(0 0 34px rgba(240,194,67,0.22)); }
    to   { filter: drop-shadow(0 0 28px rgba(255,220,120,0.70)) drop-shadow(0 0 56px rgba(255,220,120,0.40)); }
  }
  .dGlyph {
    font-size: clamp(180px, 32vw, 320px);
    line-height: 1; color: #f6d67a; font-variant-emoji: text;
    user-select: none;
    text-shadow: 0 0 24px rgba(240,194,67,0.55), 0 0 48px rgba(240,194,67,0.35), 0 0 80px rgba(240,194,67,0.20);
    animation: dGlyphFloat 6s ease-in-out infinite, dGlyphPulse 3.5s ease-in-out infinite alternate;
  }
  @keyframes dGlyphFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes dGlyphPulse {
    from { text-shadow: 0 0 20px rgba(240,194,67,0.45), 0 0 40px rgba(240,194,67,0.25), 0 0 70px rgba(240,194,67,0.15); color: #e6c060; }
    to   { text-shadow: 0 0 32px rgba(255,220,120,0.75), 0 0 64px rgba(255,220,120,0.45), 0 0 100px rgba(255,220,120,0.28); color: #fff0b3; }
  }
</style>
</head>
<body>
  <div class="dScene" id="scene">
    <div class="dStars"></div>
    <div class="dTitle" id="titleZone"></div>
    <div class="dDeityZone" id="deityZone"></div>
    <div class="dGlyphZone" id="glyphZone"></div>
  </div>
<script>
  const DAY_THEME = {
    Monday:    { deity:'deities/monday-shiva.png',
      bg:`radial-gradient(1200px 820px at 50% 38%, rgba(96,104,180,0.42), transparent 70%),radial-gradient(900px 620px at 16% 92%, rgba(44,50,120,0.55), transparent 60%),radial-gradient(900px 620px at 84% 92%, rgba(150,160,200,0.28), transparent 60%),linear-gradient(180deg,#05060f 0%,#0b0d20 55%,#05060f 100%)` },
    Tuesday:   { deity:'deities/tuesday-hanuman.png',
      bg:`radial-gradient(1200px 820px at 50% 38%, rgba(235,135,45,0.42), transparent 70%),radial-gradient(900px 620px at 16% 92%, rgba(150,22,32,0.58), transparent 60%),radial-gradient(900px 620px at 84% 92%, rgba(215,95,35,0.40), transparent 60%),linear-gradient(180deg,#140402 0%,#200906 55%,#100302 100%)` },
    Wednesday: { deity:'deities/wednesday-ganesha.png',
      bg:`radial-gradient(1200px 820px at 50% 38%, rgba(242,152,52,0.44), transparent 70%),radial-gradient(900px 620px at 16% 92%, rgba(182,92,16,0.50), transparent 60%),radial-gradient(900px 620px at 84% 92%, rgba(232,184,72,0.36), transparent 60%),linear-gradient(180deg,#120701 0%,#1e1003 55%,#100601 100%)` },
    Thursday:  { deity:'deities/thursday-vishnu.png',
      bg:`radial-gradient(1200px 820px at 50% 38%, rgba(44,124,204,0.42), transparent 70%),radial-gradient(900px 620px at 16% 92%, rgba(16,62,132,0.58), transparent 60%),radial-gradient(900px 620px at 84% 92%, rgba(224,184,84,0.28), transparent 60%),linear-gradient(180deg,#02060f 0%,#051022 55%,#02060f 100%)` },
    Friday:    { deity:'deities/friday-lakshmi.png',
      bg:`radial-gradient(1200px 820px at 50% 38%, rgba(232,96,154,0.42), transparent 70%),radial-gradient(900px 620px at 16% 92%, rgba(152,32,92,0.52), transparent 60%),radial-gradient(900px 620px at 84% 92%, rgba(232,182,92,0.32), transparent 60%),linear-gradient(180deg,#100310 0%,#1d081b 55%,#100310 100%)` },
    Saturday:  { deity:'deities/saturday-venkateswara.png',
      bg:`radial-gradient(1200px 820px at 50% 38%, rgba(44,64,146,0.42), transparent 70%),radial-gradient(900px 620px at 16% 92%, rgba(16,26,84,0.62), transparent 60%),radial-gradient(900px 620px at 84% 92%, rgba(214,174,74,0.28), transparent 60%),linear-gradient(180deg,#02030c 0%,#060918 55%,#02030c 100%)` },
    Sunday:    { deity:'deities/sunday-krishna.png',
      bg:`radial-gradient(1200px 820px at 50% 38%, rgba(22,156,166,0.42), transparent 70%),radial-gradient(900px 620px at 16% 92%, rgba(12,92,122,0.56), transparent 60%),radial-gradient(900px 620px at 84% 92%, rgba(224,184,84,0.30), transparent 60%),linear-gradient(180deg,#01080c 0%,#04151c 55%,#01080c 100%)` },
  };
  const RASI_SYMBOL = { aries:'♈',taurus:'♉',gemini:'♊',cancer:'♋',leo:'♌',virgo:'♍',
                        libra:'♎',scorpio:'♏',sagittarius:'♐',capricorn:'♑',aquarius:'♒',pisces:'♓' };
  const SILHOUETTE =
    '<svg class="dDeity dSilhouette" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="100" cy="72" r="54" fill="none" stroke="#f0c243" stroke-width="2" opacity="0.35"/>' +
    '<circle cx="100" cy="72" r="27" fill="#f0c243" opacity="0.34"/>' +
    '<path d="M100 100 C68 100 54 146 51 214 C49 252 62 276 100 276 C138 276 151 252 149 214 C146 146 132 100 100 100 Z" fill="#f0c243" opacity="0.30"/>' +
    '</svg>';

  const q = new URLSearchParams(location.search);
  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let day = (q.get('day') || '').trim();
  day = DAYS.find(d => d.toLowerCase() === day.toLowerCase())
        || new Date().toLocaleString('en-US', { weekday:'long', timeZone:'Asia/Kolkata' });
  if (!DAY_THEME[day]) day = 'Monday';
  let sign = (q.get('sign') || 'aries').trim().toLowerCase();
  if (!RASI_SYMBOL[sign]) sign = 'aries';

  const theme = DAY_THEME[day];
  document.getElementById('scene').style.background = theme.bg;

  // Title = the exact YouTube/IG title string ("<rasi telugu> (Sep 05 2026)"),
  // passed as ?title=. Split on the last "(" so the rasi name and the (date)
  // sit on their own lines. textContent only — never inject markup.
  const rawTitle = (q.get('title') || '').trim();
  if (rawTitle) {
    let name = rawTitle, date = '';
    const i = rawTitle.lastIndexOf('(');
    if (i > 0) { name = rawTitle.slice(0, i).trim(); date = rawTitle.slice(i).trim(); }
    const tz = document.getElementById('titleZone');
    const nEl = document.createElement('div'); nEl.className = 'dTitleName'; nEl.textContent = name;
    tz.appendChild(nEl);
    if (date) { const dEl = document.createElement('div'); dEl.className = 'dTitleDate'; dEl.textContent = date; tz.appendChild(dEl); }
  }

  // deity image with silhouette fallback
  const dz = document.getElementById('deityZone');
  const dimg = new Image();
  dimg.className = 'dDeity';
  dimg.onerror = () => { dz.innerHTML = SILHOUETTE; };
  dimg.src = theme.deity;
  dz.appendChild(dimg);

  // rasi emblem image, falling back to the gold text symbol
  const gz = document.getElementById('glyphZone');
  const gimg = new Image();
  gimg.className = 'dGlyphImg';
  gimg.onerror = () => {
    const d = document.createElement('div');
    d.className = 'dGlyph';
    d.textContent = RASI_SYMBOL[sign] + '︎';
    gz.innerHTML = ''; gz.appendChild(d);
  };
  gimg.src = 'rasi/' + sign + '.png';
  gz.appendChild(gimg);

  // signal readiness once both images settle (record_scene.py waits for this)
  let pending = 2;
  const settle = () => { if (--pending <= 0) window.__sceneReady = true; };
  [dimg, gimg].forEach(im => { if (im.complete) settle(); else { im.addEventListener('load', settle); im.addEventListener('error', settle); } });
  setTimeout(() => { window.__sceneReady = true; }, 4000);   // hard cap
</script>
</body>
</html>
